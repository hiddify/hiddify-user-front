name: Build the user page to gh-pages

# Every push to main builds the page on its own (index.html + assets) into the gh-pages branch.
# A panel uses it with Settings > Customizing User Page > user page URL:
#   https://github.com/<owner>/hiddify-user-front/tree/gh-pages
# (or the GitHub Pages address, when Pages is turned on for the branch). See "Custom user page" in the README.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx vite build
        env:
          USER_FRONT_OUT_DIR: dist

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
